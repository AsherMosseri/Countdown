<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asher's Launch Countdown</title>
    <meta name="description" content="A live countdown to the website launch and the app release.">

    <!-- Inline SVG favicon keeps the page a single self-contained file. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f172a'/><circle cx='16' cy='16' r='9.5' fill='none' stroke='%2338bdf8' stroke-width='2.5'/><path d='M16 10v6.3l4 2.4' fill='none' stroke='%2338bdf8' stroke-width='2.5' stroke-linecap='round'/></svg>">

    <!--
        Link preview card (Messages, Slack, iMessage, Twitter, etc).
        Preview fetchers do not run JavaScript, so these are static on purpose:
        the dates live in og-image.png instead, regenerated by og/make-og.sh.
        og:image must be an absolute URL — a relative path will not resolve.
    -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Asher's Launch Countdown">
    <meta property="og:title" content="Asher's Launch Countdown">
    <meta property="og:description" content="A live countdown to the website launch and the app release.">
    <meta property="og:url" content="https://ashermosseri.github.io/Countdown/">
    <meta property="og:image" content="https://ashermosseri.github.io/Countdown/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Asher's Launch Countdown — website goes live Mon Aug 10, app release Tue Aug 25.">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Asher's Launch Countdown">
    <meta name="twitter:description" content="A live countdown to the website launch and the app release.">
    <meta name="twitter:image" content="https://ashermosseri.github.io/Countdown/og-image.png">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
            width: 90%;
            max-width: 800px;
        }

        /* App Title Styles */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 40px;
            letter-spacing: -0.025em;
            color: #f8fafc;
        }

        /* Per-launch section headings */
        .launch-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 0 0 6px;
        }
        .launch-when {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 20px;
        }

        /* Main Standard Countdown */
        .main-countdown {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            margin-bottom: 50px;
        }
        .time-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            min-width: 100px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .main-num {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
            /* Fixed-width digits: without this every tick changes the number's
               width and the whole countdown visibly jitters once a second. */
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }
        .main-label {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-top: 8px;
        }

        /* Compact variant for the sooner (website) countdown */
        .compact .main-num { font-size: 2.5rem; }
        .compact .time-box { padding: 14px; min-width: 80px; }
        .compact .main-num { color: #38bdf8; }

        hr {
            border: 0;
            height: 1px;
            background: #334155;
            margin: 0 0 40px;
        }

        /* Totals Breakdowns Grid */
        .totals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
        }
        .total-box {
            background: #111827;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
        }
        .total-num {
            font-size: 1.75rem;
            font-weight: 700;
            color: #38bdf8;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }
        .total-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-top: 5px;
        }

        /* Shown once a countdown hits zero */
        .live {
            display: none;
            margin-bottom: 50px;
        }
        .live-msg {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #4ade80;
        }

        /* Revealed only once link.json shows up (see the script below).
           [hidden] needs an explicit rule because display:inline-block
           would otherwise override the attribute. */
        .reveal-link {
            display: inline-block;
            margin-top: 22px;
            padding: 16px 36px;
            font-size: 1.125rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            color: #0f172a;
            background: #4ade80;
            border-radius: 999px;
            text-decoration: none;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .reveal-link[hidden] { display: none; }
        .reveal-link:hover,
        .reveal-link:focus-visible {
            background: #86efac;
            transform: translateY(-1px);
        }
        .launch.done .main-countdown,
        .launch.done .totals-grid { display: none; }
        .launch.done .live { display: block; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Asher's Launch Countdown</h1>

        <!-- Website launch -->
        <section class="launch" id="site">
            <h2 class="launch-title">Website Goes Live</h2>
            <span class="launch-when"></span>

            <div class="main-countdown compact">
                <div class="time-box"><div data-u="d" class="main-num">00</div><div class="main-label">Days</div></div>
                <div class="time-box"><div data-u="h" class="main-num">00</div><div class="main-label">Hours</div></div>
                <div class="time-box"><div data-u="m" class="main-num">00</div><div class="main-label">Mins</div></div>
                <div class="time-box"><div data-u="s" class="main-num">00</div><div class="main-label">Secs</div></div>
            </div>

            <div class="live">
                <div class="live-msg">The website is live 🎉</div>
                <a class="reveal-link" hidden target="_blank" rel="noopener">Go see it &rarr;</a>
            </div>
        </section>

        <hr>

        <!-- App release -->
        <section class="launch" id="app">
            <h2 class="launch-title">App Release</h2>
            <span class="launch-when"></span>

            <!-- Part 1: Standard Countdown -->
            <div class="main-countdown">
                <div class="time-box"><div data-u="d" class="main-num">00</div><div class="main-label">Days</div></div>
                <div class="time-box"><div data-u="h" class="main-num">00</div><div class="main-label">Hours</div></div>
                <div class="time-box"><div data-u="m" class="main-num">00</div><div class="main-label">Mins</div></div>
                <div class="time-box"><div data-u="s" class="main-num">00</div><div class="main-label">Secs</div></div>
            </div>

            <!-- Part 2: Total Bit Breakdowns -->
            <div class="totals-grid">
                <div class="total-box"><div data-u="tot-w" class="total-num">0</div><div class="total-label">Total Weeks</div></div>
                <div class="total-box"><div data-u="tot-h" class="total-num">0</div><div class="total-label">Total Hours</div></div>
                <div class="total-box"><div data-u="tot-m" class="total-num">0</div><div class="total-label">Total Minutes</div></div>
                <div class="total-box"><div data-u="tot-s" class="total-num">0</div><div class="total-label">Total Seconds</div></div>
            </div>

            <div class="live">
                <div class="live-msg">The app is out 🎉</div>
            </div>
        </section>
    </div>

    <script>
        // Each launch date is written in exactly one place: the target below.
        // The offset is explicit (-04:00 = EDT) so the countdown reads the same
        // no matter what timezone the viewer is in. Dates on or after Nov 1 2026
        // are in EST and must be written -05:00.
        const launches = [
            { el: document.getElementById('site'), target: new Date("2026-08-10T19:00:00-04:00").getTime() },
            { el: document.getElementById('app'),  target: new Date("2026-08-25T16:00:00-04:00").getTime() }
        ];

        // The date shown under each heading is derived from the target, so the
        // label and the countdown can never drift out of sync.
        const etDate = new Intl.DateTimeFormat("en-US", {
            timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric"
        });
        const etTime = new Intl.DateTimeFormat("en-US", {
            timeZone: "America/New_York", hour: "numeric", minute: "2-digit"
        });

        launches.forEach(({ el, target }) => {
            const d = new Date(target);
            el.querySelector('.launch-when').textContent =
                etDate.format(d) + " · " + etTime.format(d) + " ET";
        });

        function set(section, unit, value) {
            section.querySelector('[data-u="' + unit + '"]').textContent = value;
        }

        // The launch URL is deliberately absent from this repository. It ships
        // separately as link.json at reveal time, so there is nothing to find in
        // the page or its history beforehand. Until that file is deployed this
        // request 404s, which is the expected state — not an error.
        //
        // Polling (rather than reading it once at load) means a tab left open
        // through the launch reveals the link on its own, with no refresh.
        function startReveal(el) {
            const link = el.querySelector('.reveal-link');
            if (!link || el.dataset.polling) return;   // only sections with a link
            el.dataset.polling = '1';

            const check = () => {
                fetch('link.json?t=' + Date.now(), { cache: 'no-store' })
                    .then(r => (r.ok ? r.json() : null))
                    .then(data => {
                        if (!data || !data.url) return;
                        link.href = data.url;
                        link.hidden = false;
                        clearInterval(poll);
                    })
                    .catch(() => {});   // offline or not deployed yet; try again
            };

            const poll = setInterval(check, 15000);
            check();
        }

        function updateCountdown() {
            let allDone = true;

            launches.forEach(({ el, target }) => {
                const diff = target - Date.now();

                if (diff <= 0) {
                    el.classList.add('done');
                    startReveal(el);
                    return;
                }
                allDone = false;

                // Math for Standard Display. Hours/mins/secs are padded to two
                // digits so the row never changes width as values drop.
                const pad = n => String(n).padStart(2, '0');
                set(el, 'd', Math.floor(diff / (1000 * 60 * 60 * 24)));
                set(el, 'h', pad(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))));
                set(el, 'm', pad(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))));
                set(el, 's', pad(Math.floor((diff % (1000 * 60)) / 1000)));

                // Math for Total Individual Units (with 2 decimal points for weeks)
                if (el.querySelector('.totals-grid')) {
                    set(el, 'tot-w', (diff / (1000 * 60 * 60 * 24 * 7)).toFixed(2));
                    set(el, 'tot-h', Math.floor(diff / (1000 * 60 * 60)).toLocaleString());
                    set(el, 'tot-m', Math.floor(diff / (1000 * 60)).toLocaleString());
                    set(el, 'tot-s', Math.floor(diff / 1000).toLocaleString());
                }
            });

            if (allDone) clearInterval(timerInterval);
        }

        const timerInterval = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
