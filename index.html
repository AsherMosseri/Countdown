<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asher's Launch Countdown</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
            width: 90%;
            max-width: 800px;
        }

        /* App Title Styles */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 40px;
            letter-spacing: -0.025em;
            color: #f8fafc;
        }

        /* Per-launch section headings */
        .launch-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 0 0 6px;
        }
        .launch-when {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 20px;
        }

        /* Main Standard Countdown */
        .main-countdown {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            margin-bottom: 50px;
        }
        .time-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            min-width: 100px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .main-num {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
        }
        .main-label {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-top: 8px;
        }

        /* Compact variant for the sooner (website) countdown */
        .compact .main-num { font-size: 2.5rem; }
        .compact .time-box { padding: 14px; min-width: 80px; }
        .compact .main-num { color: #38bdf8; }

        hr {
            border: 0;
            height: 1px;
            background: #334155;
            margin: 0 0 40px;
        }

        /* Totals Breakdowns Grid */
        .totals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
        }
        .total-box {
            background: #111827;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
        }
        .total-num {
            font-size: 1.75rem;
            font-weight: 700;
            color: #38bdf8;
        }
        .total-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-top: 5px;
        }

        /* Shown once a countdown hits zero */
        .live {
            display: none;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #4ade80;
            margin-bottom: 50px;
        }
        .launch.done .main-countdown,
        .launch.done .totals-grid { display: none; }
        .launch.done .live { display: block; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Asher's Launch Countdown</h1>

        <!-- Website launch -->
        <section class="launch" id="site">
            <h2 class="launch-title">Website Goes Live</h2>
            <span class="launch-when">Mon, Aug 10 &middot; 7:00 PM ET</span>

            <div class="main-countdown compact">
                <div class="time-box"><div data-u="d" class="main-num">00</div><div class="main-label">Days</div></div>
                <div class="time-box"><div data-u="h" class="main-num">00</div><div class="main-label">Hours</div></div>
                <div class="time-box"><div data-u="m" class="main-num">00</div><div class="main-label">Mins</div></div>
                <div class="time-box"><div data-u="s" class="main-num">00</div><div class="main-label">Secs</div></div>
            </div>

            <div class="live">The website is live 🎉</div>
        </section>

        <hr>

        <!-- App release -->
        <section class="launch" id="app">
            <h2 class="launch-title">App Release</h2>
            <span class="launch-when">Tue, Aug 25 &middot; 4:00 PM ET</span>

            <!-- Part 1: Standard Countdown -->
            <div class="main-countdown">
                <div class="time-box"><div data-u="d" class="main-num">00</div><div class="main-label">Days</div></div>
                <div class="time-box"><div data-u="h" class="main-num">00</div><div class="main-label">Hours</div></div>
                <div class="time-box"><div data-u="m" class="main-num">00</div><div class="main-label">Mins</div></div>
                <div class="time-box"><div data-u="s" class="main-num">00</div><div class="main-label">Secs</div></div>
            </div>

            <!-- Part 2: Total Bit Breakdowns -->
            <div class="totals-grid">
                <div class="total-box"><div data-u="tot-w" class="total-num">0</div><div class="total-label">Total Weeks</div></div>
                <div class="total-box"><div data-u="tot-h" class="total-num">0</div><div class="total-label">Total Hours</div></div>
                <div class="total-box"><div data-u="tot-m" class="total-num">0</div><div class="total-label">Total Minutes</div></div>
                <div class="total-box"><div data-u="tot-s" class="total-num">0</div><div class="total-label">Total Seconds</div></div>
            </div>

            <div class="live">The app is out 🎉</div>
        </section>
    </div>

    <script>
        // Both targets are pinned to Eastern Daylight Time (UTC-4), so the
        // countdown reads the same no matter what timezone the viewer is in.
        const launches = [
            { el: document.getElementById('site'), target: new Date("2026-08-10T19:00:00-04:00").getTime() },
            { el: document.getElementById('app'),  target: new Date("2026-08-25T16:00:00-04:00").getTime() }
        ];

        function set(section, unit, value) {
            section.querySelector('[data-u="' + unit + '"]').textContent = value;
        }

        function updateCountdown() {
            let allDone = true;

            launches.forEach(({ el, target }) => {
                const diff = target - Date.now();

                if (diff <= 0) {
                    el.classList.add('done');
                    return;
                }
                allDone = false;

                // Math for Standard Display
                set(el, 'd', Math.floor(diff / (1000 * 60 * 60 * 24)));
                set(el, 'h', Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)));
                set(el, 'm', Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)));
                set(el, 's', Math.floor((diff % (1000 * 60)) / 1000));

                // Math for Total Individual Units (with 1 decimal point for weeks)
                if (el.querySelector('.totals-grid')) {
                    set(el, 'tot-w', (diff / (1000 * 60 * 60 * 24 * 7)).toFixed(1));
                    set(el, 'tot-h', Math.floor(diff / (1000 * 60 * 60)).toLocaleString());
                    set(el, 'tot-m', Math.floor(diff / (1000 * 60)).toLocaleString());
                    set(el, 'tot-s', Math.floor(diff / 1000).toLocaleString());
                }
            });

            if (allDone) clearInterval(timerInterval);
        }

        const timerInterval = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
